<script type="text/javascript" src="sjcl.js"></script>
<script type="text/javascript" src="cookies.js"></script>
<script type="text/javascript" src="reg/oo.js"></script>
<script type="text/javascript" src="reg/idcard.js"></script>
<script type="text/javascript" src="reg/session.js"></script>

<link rel="stylesheet" media="screen" href="style.css">

<body>

        <div class="page-wrapper">

                <section class="intro" id="zen-intro">
                    <header role="banner">
                        <h1>head2toes</h1>
                        <h2>Sign In</h2>
                    </header>

                    <div></div>
            
                    <div class="summary" id="zen-summary" role="article">
                            <label for="fileinput" class="button">
                                    Load Id Card
                                </label>
                            <input class="button-hidden" type="file" id="fileinput" />
                            <label for="passphrase">Passphrase</label>
                            <input type="password" id="passphrase" autocomplete="current-password"
                                   placeholder="only for an ID Card marked with *" />
                            <div id="msg"></div>
                        <p>
                            <a href="reg/Reg.html">Register</a>
                            <a href="index.html">Back to home page</a>
                        </p>
                    </div>
            
                    <div class="preamble" id="zen-preamble" role="article">
                        <h3>How it works</h3>
                        <p>Click on choose file to select and upload ECSDA key pair from file system.</p>
                    </div>
                </section>


</body>


<script>

        document.getElementById('fileinput').addEventListener('change', function(){
            var file = this.files[0];
            console.log("name : " + file.name);
            console.log("size : " + file.size);
            console.log("type : " + file.type);
            console.log("date : " + file.lastModified);
    
            var reader = new FileReader();
    
            reader.onload = async function(e) {
            const msg = document.getElementById("msg");

            let card;
            try {
              card = await idcard.open(reader.result, document.getElementById("passphrase").value);
            } catch (err) {
              console.log(err);
              msg.innerHTML = `Not signed in: ${err.message}`;
              return;
            }

            // The private key stays in memory; only the public half is stored.
            session.unlock(card);
            session.mintCookie();

            msg.innerHTML = `Signed in as ${card.username || card.pub}.`;

            }
    
            reader.readAsText(file);
    
        }, false);
    
    </script>
