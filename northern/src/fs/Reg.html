<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link rel="stylesheet" media="screen" href="style.css">
</head>

<!--
    This page used to be a second registration flow of its own: it generated an
    ECDSA key pair on load and saved both halves into HTML5 local storage.

    The private key is no longer kept in local storage - it lives in the page's
    memory only, and the user keeps it in their ID Card file. That makes an
    unattended "generate on load" page unsafe, because a generated key that is
    never downloaded cannot be recovered.

    Registration now happens in one place, reg/Reg.html, which asks for a user
    name, offers a passphrase, and does not let the identity go unsaved. This
    page forwards there, carrying the fragment that says where to go next.
-->

<body>
  <div class="page-wrapper">
    <section class="intro" id="zen-intro">
      <header role="banner">
        <h1>head2toes</h1>
        <h2>Reg</h2>
      </header>

      <div class="summary" id="zen-summary" role="article">
        <p>Registration has moved. <a id="reg" href="/fs/get/reg/Reg.html">Continue to registration</a>.</p>
      </div>
    </section>
  </div>
</body>

<script>
    const target = "/fs/get/reg/Reg.html" + window.location.hash;
    document.getElementById("reg").href = target;
    window.location.replace(target);
</script>
</html>
