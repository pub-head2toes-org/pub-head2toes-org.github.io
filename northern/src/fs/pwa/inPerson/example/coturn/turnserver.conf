# coturn for InPerson - see ../../PLAN.md, "Spike: coturn".
#
# Northern hands out credentials that expire (/turn/api/ice), made from the
# secret below (coturn's TURN REST API). Northern is started with the same
# secret:
#
#   NORTHERN_TURN=coturn
#   NORTHERN_TURN_SECRET=<static-auth-secret below>
#   NORTHERN_TURN_URLS=turn:turn.example.org:3478?transport=udp,turn:turn.example.org:3478?transport=tcp,turns:turn.example.org:5349?transport=tcp
#   NORTHERN_TURN_STUN=stun:turn.example.org:3478
#
# Replace turn.example.org, the two addresses and the secret.

# ---- where it listens ----
listening-port=3478
tls-listening-port=5349
# On a router's NAT (a Raspberry Pi at home): the public address, then the
# Pi's own. coturn then tells browsers the address they can reach.
external-ip=203.0.113.10/192.168.1.20
# The relayed calls: one port per call and direction. 40 ports is 20 calls
# relayed at once. Forward exactly this range, UDP, on the router.
min-port=49160
max-port=49199

# ---- who may use it ----
realm=turn.example.org
use-auth-secret
# openssl rand -hex 32
static-auth-secret=CHANGE-ME-openssl-rand-hex-32
fingerprint
# A credential's nonce lasts 10 minutes, then the browser re-authenticates.
stale-nonce=600
# At most 12 relays per credential, 1200 in all.
user-quota=12
total-quota=1200

# Instead of the REST secret - the "My own TURN server" choice on
# welcome.html, one user name and password for everybody - comment out
# use-auth-secret and static-auth-secret above, and use:
# lt-cred-mech
# user=inperson:CHANGE-ME-a-long-password

# ---- TLS, for turns: (networks that only let 443/5349 out) ----
# A certificate browsers trust: Let's Encrypt, by DNS challenge (see PLAN.md).
# Cloudflare's Origin CA certificates are trusted by Cloudflare only - not here.
cert=/etc/letsencrypt/live/turn.example.org/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.org/privkey.pem
no-tlsv1
no-tlsv1_1

# ---- what it will not relay to ----
# A TURN server forwards to any address it is asked to. These keep it off the
# home network - Northern, the router, everything behind it - and itself.
no-multicast-peers
no-tcp-relay
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ---- logs ----
log-file=stdout
simple-log
