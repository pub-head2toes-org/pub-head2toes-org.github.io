<html>
        <meta name="viewport" content="width=device-width, initial-scale=1">
       <head>
           <link rel="stylesheet" type="text/css" href="s.css">
           <script type="application/javascript" src="api.js"></script>
           <script type="text/javascript" src="/fs/get/sjcl.js"></script>
       </head>
         <body data-theme="hero">
               <main>
               <h2>Send New Open Channel Msg</h2>
               <label for="openChannel">/OpenChannel/</label>
               <input class="Input" id="openChannel" name="openChannel" value="" placeholder="OpenChannelUID"/>
               <button class="Button" onclick="javascript:goSendIt();">Send it</button>
                <p>
                    <label for="sender">From: /OpenChannel/</label>
                    <input class="Input" id="sender" name="sender" value="" placeholder="OpenChannelUID"/>
                    <span id="signin" style="display:none;"><button class="Button" onclick="javascript:openWin();">Sign in</button></span>
                </p>
                <p>
                    <textarea id="msg" style="width: 100%; height: 300px;"></textarea>
                </p>
               <div>
                       <iframe id="h2t-basic" src="https://head2toes.asuscomm.com:8443/api/basic.html" frameborder="0" width="0" height="0" ></iframe>
               </div>
               <div id="system-msg"></div>
               </main>
         </body>
       </html>
       <script>
               let step = 'INIT';
               populateUid();
               showSignin();
           window.addEventListener('message', (event) => {
               if (event){
                       if (step === 'INIT'){
                               if (event.data.unavailable){
                                        document.getElementById('system-msg').innerHTML = "Open Channel not exists";
                                        return;
                               }
                               else if (event.data.uid){
                                       step = "SEMD";
                                       doSend(event.data.subscription, event.data.pub);
                                       return;
                               }
                       }
                       document.getElementById('system-msg').innerHTML = JSON.stringify(event.data);
               }
           });
               const ifrm = document.getElementById("h2t-basic");
               function goSendIt (){
                       const uid = document.getElementById('openChannel').value;
                       const url = "/OpenChannel/" + uid + ".json";
                       sendMsg(ifrm, {"op":"get", "url":url});
                       return true;
               }
               function doSend (subscription, pub){
                       const uid = document.getElementById('openChannel').value;
                       const sender = document.getElementById('sender').value;
                       const msg = document.getElementById('msg').value;
                       const timestamp = new Date().getTime();
                       const url = "/OpenChannel/" + uid + "/" + timestamp + "/" + sender + "/msg" + ".json?isPublic=" + pub;
                       let channelMsg = {};
                       channelMsg.uid = uid;
                       channelMsg.msg = msg;
                       if (localStorage.pub){
                               channelMsg.pub = localStorage.pub;
                               channelMsg.sig = getSig(msg);
                       }
                       let data = {};
                       data.op = "post";
                       data.url = url;
                       data.payload = channelMsg;
                       sendMsg (ifrm, data);
                       doPush (subscription);
               }
               function doPush (subscription){
                    const uid = document.getElementById('openChannel').value;
                    // /func/sendPush.js?openChannel=/OpenChannel/npesic.json
                    const url = "/func/sendPush.js?openChannel=/OpenChannel/" + uid + ".json";
                    // const url = "/send";
                    sendMsg(ifrm, {"op":"get", "url":url});
                    return true;
               }
               function getSig(msg){
                       if (!localStorage.priv){
                               return "N/A";
                       }
                        keyssec = new sjcl.ecc.ecdsa.secretKey(
                                sjcl.ecc.curves.c256,
                                sjcl.ecc.curves.c256.field.fromBits(sjcl.codec.base64.toBits(localStorage.priv))
                        );
                       var sig = keyssec.sign(sjcl.hash.sha256.hash(msg));
                       return sjcl.codec.base64.fromBits(sig);
               }
       
               function sendMsg (ifrm, data){
               ifrm.contentWindow.postMessage (data, "*");
       }
                function populateUid (){
                        document.getElementById('sender').value = localStorage.openchanneluid;
                }
                function openWin() {
                        signinWindow = window.open("/fs/get/Signin.html", "Sign In", "width=600,height=400");   // Opens a new window
                }
                function showSignin() {
                        if(!localStorage.pub || localStorage.pub === "notloggedin"){
                                document.getElementById('signin').style = "display : inline-block;;";
                        }
                }
       </script>
