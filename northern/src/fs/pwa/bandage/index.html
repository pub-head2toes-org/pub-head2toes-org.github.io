<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#005E7A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Bandage</title>
</head>
<body>

  <!--
    The upper third. It was reserved; this is what landed in it. The keyboard
    below is still sized off what is left, so the loops can take the whole panel
    without the keys having to move - the editor overlay covers this same space.

  -->
  <section id="stage" aria-label="Loops">

    <!--
      The rows are the functions, the columns the loop channels. Both are built
      by recorder.js from loops.COUNT, the way the keys are built from
      keys.layout: one number decides how many there are, and the markup cannot
      drift away from it.
    -->
    <table id="loop_table">
      <caption class="sr-only">Loop channels</caption>
    </table>

    <div id="loop_foot">
      <span id="transport" aria-live="polite">Stopped</span>
      <span class="spacer"></span>
      <button type="button" id="loop_save">Save</button>
      <button type="button" id="loop_load">Load</button>
      <input type="file" id="loop_file" accept=".mid,.midi,audio/midi" hidden>
    </div>

    <!--
      The editor, over the table rather than beside it: the panel is a third of
      a phone and there is no room for both. Four rows are the four notes that
      can sound at once; the columns are the sequence.
    -->
    <div id="editor" hidden>
      <div id="editor_head">
        <span id="editor_title">Loop 1</span>
        <span class="spacer"></span>
        <button type="button" id="edit_left" aria-label="Back one step">&#9664;</button>
        <button type="button" id="edit_right" aria-label="On one step">&#9654;</button>
        <button type="button" id="edit_insert" aria-label="Insert an empty step">Ins</button>
        <button type="button" id="edit_delete" aria-label="Delete this step">Del</button>
        <button type="button" id="edit_tie" aria-label="Hold the last notes through this step">Tie</button>
        <button type="button" id="edit_undo" aria-label="Undo">&#8630;</button>
        <button type="button" id="edit_redo" aria-label="Redo">&#8631;</button>
        <button type="button" id="edit_close">Close</button>
      </div>
      <table id="edit_grid"><tbody></tbody></table>
      <div id="editor_hint">Play a key to write it here; let go to move on.</div>
    </div>

  </section>

  <section id="console">
    <div id="toolbar">
      <label class="control">
        <span class="control-label">Voice</span>
        <select id="voice_select" aria-label="Instrument"></select>
      </label>

      <div class="control">
        <span class="control-label">Octave</span>
        <div class="octave">
          <button type="button" id="octave_down" aria-label="Octave down">&minus;</button>
          <span id="range_label" aria-live="polite">C3&ndash;C5</span>
          <button type="button" id="octave_up" aria-label="Octave up">+</button>
        </div>
      </div>

      <label class="control">
        <span class="control-label">Volume</span>
        <input type="range" id="volume" min="0" max="100" value="60" aria-label="Volume">
      </label>

      <div class="control">
        <span class="control-label">Sustain</span>
        <button type="button" id="sustain" aria-pressed="false">Off</button>
      </div>

      <label class="control">
        <span class="control-label">Tempo <span id="tempo_label">120 bpm</span></span>
        <input type="range" id="tempo" min="40" max="240" step="1" value="120" aria-label="Tempo">
      </label>

      <div class="control readout">
        <span class="control-label">Playing</span>
        <span id="readout" aria-live="polite">&mdash;</span>
      </div>

      <!-- The name, pushed to the far end of the strip by margin-left: auto -->
      <h1 id="brand">Bandage</h1>
    </div>

    <!-- The 25 keys are built by bandage.js from the geometry in keys.js -->
    <div id="keyboard" role="group" aria-label="25 key piano"></div>
  </section>

  <script src="./webaudio-tinysynth.js"></script>
  <script src="./keys.js"></script>
  <script src="./loops.js"></script>
  <script src="./smf.js"></script>
  <script src="./bandage.js"></script>
  <script src="./recorder.js"></script>
</body>
</html>
