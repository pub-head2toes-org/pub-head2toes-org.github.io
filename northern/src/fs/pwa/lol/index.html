<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#005E7A">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <title>LoL</title>
</head>
<body class="view-lobby">
  <!-- Lobby view: the prompt's "lobby screen" -->
  <main id="lobby_view">
    <h1>LoL</h1>
    <p class="subtitle">Laugh out Loud</p>

    <div class="field">
      <label for="player_input">Your name</label>
      <input type="text" id="player_input" placeholder="Enter your name" autocomplete="off">
    </div>

    <div class="field">
      <button type="button" id="enter_btn">Enter</button>
    </div>

    <div class="lobby-meta">
      <div>Game: <strong id="lobby_game_name">-</strong></div>
      <div>Organizer: <strong id="lobby_organizer">-</strong></div>
      <div>Participants: <strong id="lobby_participants">-</strong></div>
    </div>
  </main>

  <!-- Main (game) view -->
  <div id="game_view" class="hidden">
    <canvas id="game_canvas"></canvas>

    <div class="hud-tag">Player: <span id="hud_player">-</span></div>

    <div id="zoom_controls">
      <button type="button" id="zoom_in_btn" aria-label="Zoom in">+</button>
      <button type="button" id="zoom_out_btn" aria-label="Zoom out">-</button>
    </div>

    <div id="minimap_wrap">
      <canvas id="minimap_canvas" width="160" height="160"></canvas>
    </div>

    <div id="ability_bar" aria-label="Abilities">
      <div class="ability-slot"></div>
      <div class="ability-slot"></div>
      <div class="ability-slot"></div>
      <div class="ability-slot"></div>
      <div class="ability-slot"></div>
      <div class="ability-slot"></div>
    </div>

    <button type="button" id="booth_btn" aria-label="Toggle chat">&#9742;</button>

    <div id="chat_overlay">
      <textarea id="chat_board" readonly rows="6"></textarea>
      <div class="row">
        <input type="text" id="chat_input" placeholder="message">
        <button type="button" id="chat_send_btn">Send</button>
      </div>
    </div>
  </div>

  <script src="./lol.js"></script>
</body>
</html>
