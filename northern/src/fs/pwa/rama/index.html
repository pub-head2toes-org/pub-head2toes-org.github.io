<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8a3b5c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Rama: audio notes to remember, and to be reminded of.">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=1">
  <title>Rama</title>
</head>
<body>

<!-- Two pages, one on top of the other. The corner of the top one peels it off. -->

<!-- The recorder: one button in the middle. -->
<section class="page record front" id="page_record" aria-label="Recorder">
  <header class="bar">
    <h1>Rama</h1>
    <p class="who" id="user"></p>
  </header>
  <button type="button" class="peel" id="peel_top" aria-label="Peel off to the reminders and recordings"></button>

  <div class="stage">
    <button type="button" class="record" id="record" aria-pressed="false">
      <span class="dot" aria-hidden="true"></span>
      <span id="record_label">Record</span>
    </button>
    <p class="elapsed" id="elapsed"></p>
  </div>

  <!-- The version of the app: the one its service worker's cache is named after. -->
  <footer class="version">Rama <span id="version"></span></footer>
</section>

<!-- Under it: search, the reminders, and every recording. -->
<section class="page browse" id="page_browse" aria-label="Reminders and recordings" inert>
  <header class="bar">
    <h1>Rama</h1>
  </header>
  <button type="button" class="peel" id="peel_back" aria-label="Peel back to the recorder"></button>

  <input type="search" class="search" id="search" placeholder="Search" autocomplete="off"
         aria-label="Search the buzz, type, essay and times of every recording">

  <section class="list reminders">
    <h2>Reminders</h2>
    <div class="box" id="reminders"></div>
  </section>

  <section class="list recordings">
    <h2>Recordings</h2>
    <div class="box" id="recordings"></div>
  </section>
</section>

<p class="status" id="status" role="status"></p>

<!-- One recording: play it, and say what it is. -->
<dialog id="dlg_note" aria-labelledby="note_title">
  <form id="note_form" method="dialog">
    <h2 id="note_title">Recording <time id="note_stamp"></time></h2>

    <div class="player">
      <button type="button" class="play" id="note_play" disabled>Play</button>
      <input type="range" id="note_seek" min="0" max="0" step="0.01" value="0" aria-label="Position in the recording">
      <span class="time" id="note_time"></span>
      <audio id="note_audio" preload="metadata"></audio>
    </div>

    <label for="note_buzz">Buzz</label>
    <input type="text" id="note_buzz" maxlength="120" autocomplete="off" placeholder="What it is, in a few words">

    <label for="note_type">Type</label>
    <div class="combo">
      <input type="text" id="note_type" maxlength="30" autocomplete="off" placeholder="TODO, Recipe, HOWTO or a new one"
             role="combobox" aria-autocomplete="list" aria-controls="note_types" aria-expanded="false">
      <ul class="suggestions" id="note_types" role="listbox" aria-label="Types" hidden></ul>
    </div>

    <label for="note_remind">Reminder</label>
    <input type="datetime-local" id="note_remind">

    <label for="note_essay">Essay</label>
    <textarea id="note_essay" rows="8"></textarea>

    <p class="error" id="note_error"></p>
    <div class="buttons">
      <button type="button" id="note_close">Close</button>
      <button type="submit" class="primary" id="note_update">Update</button>
    </div>
  </form>
</dialog>

<!-- Every script and the stylesheet carry ?v=<the version in version.js>: a
     cache between here and the browser (Cloudflare keeps .js for 4 hours) can
     then never hand this page the files of another version. Bump them all with it. -->
<!-- The Northern identity: who is signed in, and whether the cookie is live. -->
<script src="../../reg/sjcl.js?v=1"></script>
<script src="../../reg/cookies.js?v=1"></script>
<script src="../../reg/oo.js?v=1"></script>
<script src="../../reg/idcard.js?v=1"></script>
<script src="../../reg/session.js?v=1"></script>

<script src="./version.js?v=1"></script>
<script src="./model.js?v=1"></script>
<script src="./store.js?v=1"></script>
<script src="./remind.js?v=1"></script>
<script src="./views.js?v=1"></script>
<script src="./rama.js?v=1"></script>
</body>
</html>
