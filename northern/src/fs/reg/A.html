    <script type="text/javascript" src="sjcl.js"></script>
    <script type="text/javascript" src="cookies.js"></script>
    <script type="text/javascript" src="oo.js"></script>
    <script type="text/javascript" src="idcard.js"></script>
    <script type="text/javascript" src="session.js"></script>

<body onLoad = "init();">

  <div class="page-wrapper">
        <section class="intro" id="zen-intro">
            <header role="banner">
                <h1>head2toes</h1>
                <h2>Sign In</h2>
            </header>
        </section>
  </div>
</body>

<script>

async function init() {
  try { 

    var localStorage = window.localStorage;

    if (localStorage.remotectrl){

      window.location.href = getNextURL();
      return;
    }

    // The private key is not kept in storage, so this page can only refresh the
    // cookie when a key happens to be in memory (adopted from an older version).
    // Otherwise a live cookie carries the session, and if there is none the user
    // is sent to Reg.html to load their ID Card.
    if (session.unlocked()){

      session.mintCookie();
      window.location.href = getNextURL();

    } else if (session.signedIn()){

      window.location.href = getNextURL();

    } else {

      window.location.href = `/fs/get/reg/Reg.html#${getNextURL()}`;
    }

  } catch(e) {
   console.log(e);
  }
}

function bakeCookie (val){
  setCookie ('ssid', val, 1);
}

function getNextURL () {
    const nextURL = window.location.hash.substr(1);
    let href = "/fs/get/home.html";
    if (nextURL){
      href = nextURL;
    }
    return href;
}
      
</script>
