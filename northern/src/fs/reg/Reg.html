<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <script type="text/javascript" src="sjcl.js"></script>
    <script type="text/javascript" src="cookies.js"></script>
    <script type="text/javascript" src="db.js"></script>
    <script type="text/javascript" src="oo.js"></script>
    <script type="text/javascript" src="idcard.js"></script>
    <script type="text/javascript" src="keystore.js"></script>
    <script type="text/javascript" src="session.js"></script>
    <link rel="stylesheet" media="screen" href="style.css">
</head>


<body onLoad = "init();">

  <div class="page-wrapper">

    <header role="banner" class="site">
        <h1>User Registration</h1>
    </header>

    <!-- Info: everything the page has to say, in one place. -->
    <section class="intro board">
        <h2>Info</h2>
        <div id="msg" class="info" role="status" aria-live="polite"></div>
    </section>

    <!-- Sign in and Reg are an accordion: both start closed, and opening one
         closes the other. <details name> does that in current browsers;
         closeOtherPanels() covers the ones that predate it. -->

    <!-- Sign in: for an ID Card that already exists. -->
    <section class="intro">
      <details class="panel" name="access" id="signin_panel" ontoggle="closeOtherPanels(this)">
        <summary><h2>Sign in</h2></summary>

        <div class="summary" role="article">
            <label for="signin_passphrase">Passphrase <small>(optional)</small></label>
            <input type="password" id="signin_passphrase" name="signin_passphrase"
                   autocomplete="current-password"
                   placeholder="only for an ID Card marked with *" />

            <label for="fileinput" class="menu-item">Load Id Card &amp; Continue</label>
            <input class="button-hidden" type="file" id="fileinput" />

            <p class="hint">An ID Card whose name is marked with <code>*</code> is
               encrypted &mdash; type its passphrase above before loading it.</p>

            <!-- Shown only while the session cookie is live: no file needed then. -->
            <a id="continue" class="menu-item" href="#" hidden>Continue</a>
        </div>
      </details>
    </section>

    <!-- Reg: for a brand new identity, which exists only until its card is saved. -->
    <section class="intro">
      <details class="panel" name="access" id="reg_panel" ontoggle="closeOtherPanels(this)">
        <summary><h2>Reg</h2></summary>

        <div class="summary" role="article">
          <label for="username">User name</label>
          <input type="text" id="username" name="username" autocomplete="username"
                 placeholder="how you want to be known" maxlength="60" />

          <label for="passphrase">Passphrase <small>(optional)</small></label>
          <input type="password" id="passphrase" name="passphrase" autocomplete="new-password"
                 placeholder="leave empty to save an unencrypted ID Card" />

          <label for="passphrase2">Repeat passphrase</label>
          <input type="password" id="passphrase2" name="passphrase2" autocomplete="new-password"
                 placeholder="repeat it - a typo here cannot be recovered" />

          <!-- Kept for the script, which still fills it in, but not shown. -->
          <label for="pubkey" hidden>Public key</label>
          <input type="text" id="pubkey" name="pubkey" readonly hidden
                 placeholder="generated for you" />

          <button class="menu-item" onclick="javascript:saveToNamedFile()">Save Id Card &amp; Continue</button>
        </div>
      </details>
    </section>

  </div>
</body>

<script>
        document.getElementById('fileinput').addEventListener('change', function(){
            var file = this.files[0];
            console.log("name : " + file.name);
            console.log("size : " + file.size);
            console.log("type : " + file.type);
            console.log("date : " + file.lastModified);

            var reader = new FileReader();

            reader.onload = async function(e) {
            const text = reader.result;

            let card;
            try {
              card = await idcard.open(text, getSignInPassphrase());
            } catch (err) {
              console.log(err);
              say(`ID Card not loaded: ${err.message}`);
              return;
            }

            // The key goes into memory only; session storage keeps the public half.
            session.unlock(card);
            session.mintCookie();
            unsavedIdentity = false;

            if (card.username){
              document.getElementById("username").value = card.username;
            }
            showPub();

            const who = card.username ? `${card.username} (${card.pub})` : card.pub;
            say(`ID loaded!  ID=${who}`);

            // "Load Id Card & Continue": there is nothing left to do on this
            // page, once the key-agreement copy is safely in IndexedDB.
            await session.kept();
            window.location.href = getNextURL();

            }

            reader.readAsText(file);

        }, false);


// Set while a freshly generated identity exists only in this page's memory.
var unsavedIdentity = false;

// The key pair the Reg section offers, drafted on every visit. It belongs to
// nobody until Save Id Card is pressed - see currentDraft().
var draft = null;

async function init() {
  try {

    var localStorage = window.localStorage;

    // The User name field starts empty: Reg makes a new identity, so the last
    // name used in this browser is not offered for it.

    if (localStorage.remotectrl){

      window.location.href = getNextURL();
      return;
    }

    currentDraft();

    // A key left in storage by an older version was taken into memory and
    // scrubbed when session.js loaded; the cookie can be refreshed right away.
    if (session.unlocked()){

      session.mintCookie();
      say(`ID key found!  ID=${session.pub()}`);

    } else if (session.signedIn()){

      // The cookie is still good, so nothing has to be signed on this visit.
      say(`Signed in as ${session.userName() || session.pub()}.
Open Sign in to continue, or to load your ID Card if you want to save a fresh copy.
The ID Card under Reg is a new identity - saving it replaces this one.`);

    } else if (session.known()){

      say(`Your session has expired.
Open Sign in and load the ID Card for ${session.userName() || session.pub()},
or open Reg and save a new ID Card to register as somebody new.`);

    } else {

      session.adopt(currentDraft(), document.getElementById("username").value);
      session.mintCookie();
      unsavedIdentity = true;

      say(`New ID keys generated.

These keys are held in this page only - they are NOT saved in the browser.
Open Reg and save the ID Card now, or the identity is lost when you leave this page.
Already have an ID Card? Open Sign in and load it instead.`);
   }

    showPub();
    showContinue();

  } catch(e) {
   console.log(e);
  }
}

// A generated key that has not been downloaded yet cannot be recovered.
window.addEventListener("beforeunload", function (event) {
  if (unsavedIdentity){
    event.preventDefault();
    event.returnValue = "";
    return "";
  }
});

// The Info board: always showing the latest word, as text and never as markup.
function say (text){
  document.getElementById("msg").textContent = text;
}

/**
 * The pair the Reg section is offering. Drafted once per visit and kept until
 * it is saved: a live session cookie is not a loaded key, so without a draft
 * there would be nothing for Save Id Card to write.
 */
function currentDraft (){
  if (!draft){
    draft = session.draft();
  }
  return draft;
}

/** The public key Save Id Card would write: the loaded card's, or the draft's. */
function savedPub (){
  return session.unlocked() ? session.pub() : currentDraft().pub;
}

// The public half of that key, kept in the Reg section's hidden field. The
// private half is only ever in the file.
function showPub (){
  document.getElementById("pubkey").value = savedPub();
}

// A short way to name whoever is signed in: the user name, or the head of the
// public key when there is none - the full key is on the page already.
function whoAmI (){
  return session.userName() || `${session.pub().substr(0, 8)}...`;
}

/**
 * A live session needs no file, so offer to carry straight on. Hidden while a
 * newly generated identity is still unsaved: leaving the page then loses the
 * key, which is why the Continue link was taken off the Reg section.
 */
function showContinue (){
  const button = document.getElementById("continue");
  const live = !unsavedIdentity && session.signedIn();

  button.hidden = !live;
  if (live){
    button.href = getNextURL();
    button.textContent = `Continue as ${whoAmI()}`;
  }
}

// Sign in and Reg are an accordion: opening one panel closes the other.
// Browsers that know <details name> have done it already.
function closeOtherPanels (opened){
  if (!opened.open){
    return;
  }
  document.querySelectorAll("details.panel").forEach(function (panel){
    if (panel !== opened){
      panel.open = false;
    }
  });
}

function getNextURL () {
    const nextURL = window.location.hash.substr(1);
    let href = "/fs/get/home.html";
    if (nextURL){
      href = nextURL;
    }
    return href;
}


// The user name typed on this page, remembered for the next visit.
function rememberUserName (){
  return session.rememberUserName(document.getElementById("username").value);
}

// The Reg section's passphrase, which encrypts the ID Card being saved.
function getPassphrase (){
  return document.getElementById("passphrase").value;
}

// The Sign in section's passphrase, which decrypts the ID Card being loaded.
function getSignInPassphrase (){
  return document.getElementById("signin_passphrase").value;
}

/**
 * The ID Card the Reg section would save: the loaded card when there is one,
 * and otherwise this visit's drafted pair, which nothing has adopted yet.
 */
function currentIdCard (){
  const username = rememberUserName();
  if (session.unlocked()){
    return session.card();
  }
  return idcard.build(username, currentDraft().pub, currentDraft().priv);
}

function saveIdCard (){
      const ts = new Date().getTime();
      var ctx = {};
      // Only ever the public half: the private key must not reach the server.
      rememberUserName();
      const payload = session.publicRecord();
      ctx.reqPath = `/id/${ts}/${payload.pub}.json?isPublic=true`;
      ctx.payload = JSON.stringify(payload);
      insertOperation (confirmReg, ctx);
}


function bakeCookie (val){
  setCookie ('ssid', val, 1);
}

function confirmReg (ctx){
    say(`New ID keys reistered! ID=${ctx.reqPath}`);
    console.log(JSON.stringify(ctx));
    window.location.href = getNextURL();
}

async function saveToNamedFile (){
  const passphrase = getPassphrase();

  if (passphrase && passphrase !== document.getElementById("passphrase2").value){
    say("The two passphrases do not match. Nothing was saved.");
    return;
  }

  let file;
  try {
    file = await idcard.toFile(currentIdCard(), passphrase);
  } catch (err) {
    console.log(err);
    say(`ID Card not saved: ${err.message}`);
    return;
  }

  // The card is on its way to disk, so the pair it holds becomes this browser's
  // identity - replacing whoever was signed in, whose own card is untouched.
  // Nothing was adopted until here, so a card that could not be built changes
  // nothing at all.
  if (!session.unlocked()){
    session.adopt(currentDraft(), document.getElementById("username").value);
    session.mintCookie();
    draft = null;
    showPub();
    showContinue();
  }

  // The identity now exists off this page, so leaving is safe again.
  unsavedIdentity = false;

  var uriContent = "data:application/octet-stream," + encodeURIComponent(file.content);
  var downloadLink = document.createElement("a");
  downloadLink.href = uriContent;
  downloadLink.download = file.name;

  document.body.appendChild(downloadLink);
  downloadLink.click();
  document.body.removeChild(downloadLink);

  saveIdCard();
}

</script>
</html>
